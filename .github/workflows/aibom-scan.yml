name: AIBOM Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  aibom-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install cisco-aibom
        run: |
          uv tool install --python 3.13 "cisco-aibom[all]"

      - name: Run AIBOM analysis
        env:
          AIBOM_LLM_MODEL: gpt-4o
          AIBOM_LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AIBOM_LLM_PROVIDER: openai
        run: |
          cisco-aibom analyze . \
            --output-format json \
            --output-file aibom-report.json \
            --llm-model gpt-4o \
            --llm-api-key ${{ secrets.OPENAI_API_KEY }} \
            --policy .aibom-policy.yaml

      - name: Upload AIBOM report
        uses: actions/upload-artifact@v4
        with:
          name: aibom-report
          path: aibom-report.json

      - name: Fail on high risk
        run: |
          python -c "
          import json, sys
          r = json.load(open('aibom-report.json'))
          score = r.get('risk', {}).get('score', 0)
          severity = r.get('risk', {}).get('severity', 'INFO')
          print(f'Risk score: {score}, severity: {severity}')
          if severity in ('HIGH', 'CRITICAL'):
              sys.exit(1)
          "
