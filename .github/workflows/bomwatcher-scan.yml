name: BOMWatcher scan

on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
