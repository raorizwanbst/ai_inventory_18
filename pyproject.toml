[project]
name = "enterprise-rag-agent-platform"
version = "2.4.1"
description = "Multi-agent RAG platform with MCP tools, guardrails, and ML training pipelines"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.1",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "chromadb>=0.5.0",
    "pinecone-client>=5.0.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.44.0",
    "torch>=2.4.0",
    "datasets>=2.21.0",
    "mlflow>=2.15.0",
    "wandb>=0.17.0",
    "dvc>=3.50.0",
    "feast>=0.40.0",
    "langchain-huggingface>=0.0.3",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "accelerate>=0.33.0",
    "peft>=0.12.0",
    "bitsandbytes>=0.43.0",
    "langfuse>=2.40.0",
    "galileo-observe>=0.1.0",
    "guardrails-ai>=0.5.0",
    "nemo-guardrails>=0.9.0",
    "llama-index>=0.11.0",
    "haystack-ai>=2.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0", "mypy>=1.11.0"]
training = ["deepspeed>=0.14.0", "trl>=0.9.0"]

[tool.uv]
dev-dependencies = ["pytest>=8.0"]
